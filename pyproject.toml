[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-file-tools"
version = "0.4.0"
description = "File system tools with path normalization, telemetry auditing, and guardrails for AI agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agent-core-utils>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv.sources]
agent-core-utils = { git = "https://github.com/CodeCentury22/agent-core-utils.git", rev = "v0.2.0" }
